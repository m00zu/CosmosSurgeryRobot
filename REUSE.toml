version = 1
SPDX-PackageName = "Cosmos3-H-Dreams"
SPDX-PackageSupplier = "NVIDIA Corporation"
SPDX-PackageDownloadLocation = "NOASSERTION"

# Files in this repository that do not (or cannot reasonably) carry a per-file
# SPDX header are licensed via this manifest, per REUSE 3.3.
#
# All first-party source is Apache-2.0; per-file SPDX headers are
# the authoritative source for files that carry them, and the table below
# fills the gaps for config, build, asset, and documentation files where an
# inline header would be intrusive or break tooling.
#
# Third-party dependencies are NOT declared here: they are consumed at
# runtime through Python's import system (no source redistribution). Their
# attributions live in THIRD-PARTY-NOTICES.

# --- Default: every other file in the repo is NVIDIA-authored Apache-2.0 ---
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "Copyright (c) 2026 NVIDIA CORPORATION & AFFILIATES. All rights reserved."
SPDX-License-Identifier = "Apache-2.0"

# --- Documentation files (CC-BY-4.0 is the standard choice for prose;
#     keeping Apache-2.0 here for parity with the rest of the project so
#     code snippets quoted in docs match the source license). ---
[[annotations]]
path = ["**.md", "**.rst"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Copyright (c) 2026 NVIDIA CORPORATION & AFFILIATES. All rights reserved."
SPDX-License-Identifier = "Apache-2.0"

# --- Configuration / build / CI / shell scripts ---
[[annotations]]
path = [
    ".github/**",
    ".pre-commit-config.yaml",
    ".pre-commit-config-base.yaml",
    ".gitignore",
    ".gitattributes",
    "pyproject.toml",
    "uv.lock",
    "docker/**",
    "tests/run_tests_*.sh",
    "assets/*.sh",
    "skills/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "Copyright (c) 2026 NVIDIA CORPORATION & AFFILIATES. All rights reserved."
SPDX-License-Identifier = "Apache-2.0"

# --- Binary assets (images, video clips, model snapshots, lock files) carry
#     no inline header. They are NVIDIA-authored unless otherwise noted in
#     NOTICE. ---
[[annotations]]
path = [
    "assets/**.png",
    "assets/**.jpg",
    "assets/**.jpeg",
    "assets/**.webp",
    "assets/**.mp4",
    "assets/**.gif",
    "assets/**.svg",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "Copyright (c) 2026 NVIDIA CORPORATION & AFFILIATES. All rights reserved."
SPDX-License-Identifier = "Apache-2.0"

# CMR surgical (cholecystectomy), episode_004148, from Open-H-Embodiment.
[[annotations]]
path = [
    "assets/example_data/scenes/example_frame.png",
]
precedence = "override"
SPDX-FileCopyrightText = "CMR and the Open-H-Embodiment dataset contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# More CMR cholecystectomy frames from Open-H-Embodiment, resized to 1280x720.
[[annotations]]
path = "assets/scenes/cholecystectomy/*.jpg"
precedence = "override"
SPDX-FileCopyrightText = "CMR and the Open-H-Embodiment dataset contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# NVIDIA-generated example trajectory for
# Cosmos3-H-Dreams; separate from the CMR/Open-H-Embodiment image above.
[[annotations]]
path = "assets/example_data/scenes/trajectory.npy"
precedence = "override"
SPDX-FileCopyrightText = "Copyright (c) 2026 NVIDIA CORPORATION & AFFILIATES. All rights reserved."
SPDX-License-Identifier = "Apache-2.0"

# Downscaled frames the model generated from the CC-BY-4.0 example frame above;
# the device test kit's H100 reference (docs/rtx5090-test-kit.md).
[[annotations]]
path = "assets/device_check/h100_reference.npz"
precedence = "override"
SPDX-FileCopyrightText = [
    "CMR and the Open-H-Embodiment dataset contributors",
    "Copyright (c) 2026 NVIDIA CORPORATION & AFFILIATES. All rights reserved.",
]
SPDX-License-Identifier = "CC-BY-4.0"

# Screenshots of the training ground; the video shows frames the model generated
# from the CC-BY-4.0 example frame above (docs/training-ground-setup.md).
[[annotations]]
path = "docs/images/training-ground-*.png"
precedence = "override"
SPDX-FileCopyrightText = [
    "CMR and the Open-H-Embodiment dataset contributors",
    "Copyright (c) 2026 NVIDIA CORPORATION & AFFILIATES. All rights reserved.",
]
SPDX-License-Identifier = "CC-BY-4.0"
