# The swing moves 0.12 m in 0.15 s (5 frames, 0.167 s): mean 0.72 m/s, peak 1.08 m/s.
# Acceleration peaks at 26 m/s² (limit 3), so the guard stops it however it samples;
# speed measured by the guard: 0.78 m/s at 30 Hz sampling, 0.42 m/s at 10 Hz (limit 0.35). The other moves stay under
# 0.07 m/s and 0.19 m/s².
id: safety-stop
course: Starter course
order: 4
title: What a safety stop looks like
brief: >-
  Watch the right hook move at a normal speed, then swing 12 cm in 0.15 s.
  The safety guard refuses the swing, holds the video and names the limit it
  exceeded. Press Resume to take over from the last safe pose.
demo_only: true
demo:
  scripted:
    - {caption: "Start at home", wait_s: 1}
    - {caption: "Normal speed", side: right, move_to: [0.20, 1.0, -0.30], over_s: 1.5}
    - {wait_s: 1}
    - {caption: "Too fast: the guard stops it", side: right, move_to: [0.08, 1.0, -0.30], over_s: 0.15}
    - {wait_s: 1}
    - {caption: "Return home", side: right, home: true, over_s: 1.5}
