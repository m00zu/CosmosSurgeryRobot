# Training ground for a laptop RTX 5090 (24 GB, sm_120): open https://<server>:8443/train.
# Starts in Balanced mode (FP8 MLP, bf16 attention); switch modes in /train Settings.
# Paths are relative to the launch directory.
runtime:
  preset: wan-taehv-chunk2-2steps-fademem-compile
  checkpoint: data_local/checkpoints/c3-h-d_2-step_model_bf16.safetensors
  offload_understanding: true
  fp8_generation: true
  fp8_scope: mlp
  # Plain-SDPA refresh once FadeMem memory is full (faster; not bit-identical to varlen).
  steady_refresh_sdpa: true
  # SageAttention on RTX 50 when installed (scripts/install_sageattention.sh), else SDPA.
  attention_kernel: auto
  # Saved prompt K/V: later starts load the model without its understanding weights
  # (~26 GB less host RAM). The first start builds the file. Every scene must share one prompt.
  text_cache: data_local/text_kv/c3-h-d_2-step_480x832.pt

headset:
  preset: headset-base
  # Play 8-frame chunks as fast as the 30 Hz input fills them, or chunks queue behind playback.
  display_fps: 30
  cert: cert.pem
  key: key.pem

# About the highest values surgeons reached in 40 CMR cholecystectomies (hand motion,
# Open-H-Embodiment); see SafetyLimits in safety.py for the measured percentiles.
safety:
  max_speed_m_s: 0.35
  max_acceleration_m_s2: 3.0
  max_rotation_rad_s: 4.0
  max_energy_s: 10.0
  max_energy_dose_s: 14.0
  energy_dose_window_s: 15.0
  max_energy_sweep_m: 0.10

recording:
  dir: recordings

# The tools on each instrument. The server ignores a control the instrument lacks,
# /train shows each instrument's own controls, and courses may only use these tools.
instruments:
  left: {name: Grasper, tools: [jaws]}
  right: {name: Hook, tools: [energy]}

# Guided exercises for /train (Courses button). Remove the block to hide courses.
courses:
  dir: cosmos3_h_dreams/courses   # shipped exercises, one YAML per exercise
  demos_dir: data_local/demos     # demos saved from the dashboard (gitignored)

